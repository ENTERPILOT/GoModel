{{define "dashboard-page-failover"}}
<template x-if="page==='failover'">
<div>
    <div class="page-header">
        <h2>Failover</h2>
        <div class="model-count" x-show="failoverRules.length > 0">
            <span x-text="failoverRules.length"></span> mappings
        </div>
    </div>

    {{template "auth-banner" .}}

    <div class="alert alert-warning" x-show="!failoverAvailable && !authError">
        Failover feature is unavailable.
    </div>
    <div class="alert alert-warning" x-show="failoverError && !authError" x-text="failoverError"></div>
    <div class="alert alert-success" x-show="failoverNotice && !failoverError" x-text="failoverNotice"></div>

    <div class="table-toolbar">
        <div class="table-toolbar-main">
            <div class="filter-input-wrap">
                <i data-lucide="search" class="filter-input-icon" aria-hidden="true"></i>
                <input type="text" placeholder="Filter models..." aria-label="Filter models" x-model="modelFilter" class="filter-input">
            </div>
        </div>
        <div class="table-toolbar-actions">
            <button type="button" class="pagination-btn pagination-btn-with-icon" :disabled="failoverSaving || !failoverAvailable || !failoverEnabled()" @click="openFailoverResetDialog()">
                <i data-lucide="rotate-ccw" class="form-action-icon" aria-hidden="true"></i>
                <span>Reset all the failover models</span>
            </button>
            <button type="button" class="pagination-btn pagination-btn-primary pagination-btn-with-icon" :disabled="failoverSaving || !failoverAvailable || !failoverEnabled()" @click="generateFailoverRules()">
                <i data-lucide="wand-sparkles" class="form-action-icon" aria-hidden="true"></i>
                <span>Generate failover models automatically</span>
            </button>
        </div>
    </div>

    <div class="loading-state" x-show="failoverLoading && !authError" role="status" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
        <span>Loading failover mappings...</span>
    </div>

    <div class="table-wrapper" x-show="failoverRules.length > 0">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Primary model</th>
                    <th>Fallback models</th>
                    <th>Status</th>
                    <th>Configured by</th>
                    <th class="model-actions-header">Actions</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="rule in failoverRules" :key="failoverPrimaryModel(rule)">
                    <tr>
                        <td class="mono" x-text="failoverPrimaryModel(rule)"></td>
                        <td class="mono" x-text="failoverTargetLabel(rule)"></td>
                        <td x-text="failoverRuleStatus(rule)"></td>
                        <td x-text="rule.managed_source || 'dashboard'"></td>
                        <td class="model-row-actions">
                            <div class="alias-actions-cell model-list-actions">
                                <button type="button" class="table-action-btn table-icon-btn"
                                    :aria-label="'Edit failover for ' + failoverPrimaryModel(rule)"
                                    :title="'Edit failover for ' + failoverPrimaryModel(rule)"
                                    @click="openFailoverEdit(rule)">
                                    {{template "edit-icon"}}
                                </button>
                                <button type="button" class="table-action-btn table-action-btn-danger table-icon-btn"
                                    x-show="!rule.managed"
                                    :aria-label="'Remove failover for ' + failoverPrimaryModel(rule)"
                                    :title="'Remove failover for ' + failoverPrimaryModel(rule)"
                                    @click="deleteFailoverRule(rule)">
                                    {{template "trash-icon"}}
                                </button>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <div class="table-wrapper" x-show="failoverGeneratedRules.length > 0">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Generated primary model</th>
                    <th>Generated fallback models</th>
                    <th class="model-actions-header">Actions</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="rule in failoverGeneratedRules" :key="'generated:' + failoverPrimaryModel(rule)">
                    <tr>
                        <td class="mono" x-text="failoverPrimaryModel(rule)"></td>
                        <td class="mono" x-text="failoverTargetLabel(rule)"></td>
                        <td class="model-row-actions">
                            <button type="button" class="table-action-btn table-icon-btn"
                                :aria-label="'Review generated failover for ' + failoverPrimaryModel(rule)"
                                :title="'Review generated failover for ' + failoverPrimaryModel(rule)"
                                @click="openFailoverGenerated(rule)">
                                {{template "edit-icon"}}
                            </button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <div class="empty-state" x-show="!failoverLoading && failoverRules.length === 0 && failoverGeneratedRules.length === 0 && !authError">
        <p>No failover mappings configured.</p>
    </div>
</div>
</template>
{{end}}
