version: "2"
linters:
  enable:
    - dupl
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - testifylint
    - unused
  settings:
    dupl:
      threshold: 100
    testifylint:
      enable-all: true
      disable:
        # Exact byte comparisons of JSON are intentional: the gateway preserves
        # unknown fields and key order, which JSONEq would stop checking.
        - encoded-compare
        # Exact float literals in tests are intentional; InDelta would hide
        # real mismatches.
        - float-compare
  exclusions:
    rules:
      - linters:
          - dupl
        path: _test\.go
      - linters:
          - dupl
        path: tests/
      # Tests use fixture credentials, temp files, and local HTTP servers.
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - gosec
        path: tests/
      # Developer tool: fetches the configured provider and writes golden
      # files into the repository.
      - linters:
          - gosec
        path: cmd/recordapi/
      # Developer benchmark tool: runs ps against the benchmarked process.
      - linters:
          - gosec
        path: docs/about/benchmark-tools/
      # WHERE clauses are joined from constant fragments; every value is a
      # bound parameter.
      - linters:
          - gosec
        path: internal/usage/
        text: G202
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
