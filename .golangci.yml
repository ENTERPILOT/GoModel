version: "2"
linters:
  enable:
    - dupl
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - testifylint
    - unused
  settings:
    dupl:
      threshold: 100
    testifylint:
      enable-all: true
      disable:
        # Exact byte comparisons of JSON are intentional: the gateway preserves
        # unknown fields and key order, which JSONEq would stop checking.
        - encoded-compare
        # Exact float literals in tests are intentional; InDelta would hide
        # real mismatches.
        - float-compare
  exclusions:
    rules:
      - linters:
          - dupl
        path: _test\.go
      - linters:
          - dupl
        path: tests/
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
