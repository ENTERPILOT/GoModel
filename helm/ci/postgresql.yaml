# Throwaway PostgreSQL for the chart's CI install test. Not for production.
apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgresql
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: postgresql
      template:
        metadata:
          labels:
            app: postgresql
        spec:
          containers:
            - name: postgresql
              image: postgres:18-alpine
              env:
                - name: POSTGRES_USER
                  value: gomodel
                - name: POSTGRES_PASSWORD
                  value: gomodel
                - name: POSTGRES_DB
                  value: gomodel
              ports:
                - containerPort: 5432
              readinessProbe:
                exec:
                  command: [pg_isready, -U, gomodel]
                periodSeconds: 2
  - apiVersion: v1
    kind: Service
    metadata:
      name: postgresql
    spec:
      selector:
        app: postgresql
      ports:
        - port: 5432
