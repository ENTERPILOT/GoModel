apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gomodel.fullname" . }}
  labels:
    {{- include "gomodel.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.server.port | quote }}
  GOMODEL_BASE_PATH: {{ .Values.server.basePath | default "/" | quote }}
  GOMODEL_USER_PATH_HEADER: {{ .Values.server.userPathHeader | default "X-GoModel-User-Path" | quote }}
  GOMODEL_BODY_SIZE_LIMIT: {{ .Values.server.bodySizeLimit | quote }}
  {{- if or .Values.redis.enabled .Values.cache.redis.url }}
  GOMODEL_REDIS_KEY_MODELS: {{ .Values.cache.redis.keyModels | default "gomodel:models" | quote }}
  GOMODEL_REDIS_KEY_RESPONSES: {{ .Values.cache.redis.keyResponses | default "gomodel:response:" | quote }}
  GOMODEL_REDIS_TTL_MODELS: {{ .Values.cache.redis.ttlModels | default 86400 | quote }}
  GOMODEL_REDIS_TTL_RESPONSES: {{ .Values.cache.redis.ttlResponses | default 3600 | quote }}
  GOMODEL_RESPONSE_CACHE_SIMPLE_ENABLED: "true"
  {{- end }}
  GOMODEL_METRICS_ENABLED: {{ .Values.metrics.enabled | quote }}
  GOMODEL_METRICS_ENDPOINT: {{ .Values.metrics.endpoint | quote }}
  GOMODEL_LOG_FORMAT: {{ .Values.logging.format | quote }}
