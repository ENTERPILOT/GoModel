{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gomodel.fullname" . }}
  labels:
    {{- include "gomodel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gomodel.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        # The release's own pods, so `helm test` keeps working.
        - podSelector:
            matchLabels:
              {{- include "gomodel.selectorLabels" $ | nindent 14 }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    # The release's own pods, so `helm test` keeps working.
    - to:
        - podSelector:
            matchLabels:
              {{- include "gomodel.selectorLabels" $ | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
