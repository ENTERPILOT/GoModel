apiVersion: v1
kind: Pod
metadata:
  name: {{ include "gomodel.fullname" . }}-test-connection
  labels:
    {{- include "gomodel.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.16.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - curl
        - --fail
        - --silent
        - --show-error
        - --retry
        - "5"
        - --retry-connrefused
        {{- if eq (include "gomodel.scheme" .) "https" }}
        # The certificate is issued for the names clients use, not
        # necessarily the Service name; this only checks that it answers.
        - --insecure
        {{- end }}
        - {{ printf "%s://%s:%d%s" (include "gomodel.scheme" .) (include "gomodel.fullname" .) (int .Values.service.port) (include "gomodel.pathWithBasePath" (dict "root" . "path" "/health/ready")) | quote }}
