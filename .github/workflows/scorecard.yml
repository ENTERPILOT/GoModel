name: Scorecard

# publish_results makes the Scorecard API reject runs from a workflow that has
# top-level env or defaults, workflow-level write permissions, or steps in the
# analysis job other than checkout, scorecard-action, upload-artifact,
# upload-sarif and harden-runner (no `run` steps). See
# https://github.com/ossf/scorecard-action#workflow-restrictions.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 3"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # OIDC token that authenticates publish_results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to api.scorecard.dev, which serves the README badge.
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
