name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-validate:
    name: Docs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # To avoid possible issues related to missing libsecret binary on the runner
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      # Pinned: a bare `npx mint` installs the release published last, and a
      # mint release reaches npm a few minutes before the @mintlify/cli version
      # it depends on, so a run in that window fails with ETARGET. Dependabot
      # does not see this pin; bump it by hand.
      - name: Validate docs.json
        run: npx mint@4.3.37 validate
        working-directory: docs
