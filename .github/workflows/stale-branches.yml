name: Stale Branches

# Deletes branches whose pull request was closed or merged more than DAYS ago.
# Branches with an open PR, without any PR, protected, or with commits pushed
# after the PR closed are kept. Deleted branches can be restored from the PR page.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Delete branches whose PR closed more than this many days ago
        default: "30"
      dry_run:
        description: Only list branches that would be deleted
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: stale-branches

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DAYS: ${{ inputs.days || '30' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Delete stale branches
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/branches?per_page=100" \
            --jq '.[] | select(.protected | not) | "\(.name) \(.commit.sha)"' > branches.txt
          gh pr list -R "$REPO" --state open --limit 1000 \
            --json headRefName --jq '.[].headRefName' > open.txt
          # Latest closed PR per branch, closed before the cutoff.
          gh pr list -R "$REPO" --state closed --limit 10000 \
            --json headRefName,headRefOid,closedAt,isCrossRepository \
            --jq "map(select(.isCrossRepository | not)) | group_by(.headRefName) | map(max_by(.closedAt))
              | .[] | select(.closedAt < (now - $DAYS * 86400 | todate)) | \"\(.headRefName) \(.headRefOid)\"" > stale.txt

          deleted=0
          while read -r ref oid; do
            [ "$ref" = "$DEFAULT_BRANCH" ] && continue
            grep -qxF "$ref" open.txt && continue
            grep -qxF "$ref $oid" branches.txt || continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "would delete $ref"
            elif gh api -X DELETE "repos/$REPO/git/refs/heads/$ref" --silent; then
              echo "deleted $ref"
            else
              echo "::warning::failed to delete $ref"
              continue
            fi
            deleted=$((deleted + 1))
          done < stale.txt

          echo "### Stale branches: $deleted $([ "$DRY_RUN" = "true" ] && echo "would be deleted" || echo "deleted")" >> "$GITHUB_STEP_SUMMARY"
