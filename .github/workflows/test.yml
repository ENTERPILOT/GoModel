name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  # Pull requests run the suites in -short mode: it skips the plugin fixture
  # builds (`go build -buildmode=plugin` of the whole gateway) and the e2e
  # shared-object round trip, which together cost about a minute of runner
  # time and have no relation to the change under review. Pushes to main run
  # everything.
  GO_TEST_SHORT: ${{ github.event_name == 'pull_request' && '-short' || '' }}

# Restrict token permissions to minimum required
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No step in this workflow needs git credentials, and leaving
          # the token in .git/config exposes it to everything that runs
          # afterwards, npm install scripts included.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # v2.13+ supports Go 1.27 and bundles a compatible staticcheck.
          version: v2.13.1
          # The shared analysis cache went bad once (2026-08-25: staticcheck
          # lost t.Fatal no-return facts and flagged SA5011 false positives in
          # untouched files). Rotating the cache key daily bounds how long a
          # corrupted cache can live while keeping the ~1 min a cold analysis
          # costs off every run.
          cache-invalidation-interval: 1
          # Temporary workaround: config verification fetches the remote JSON schema and
          # intermittently times out in CI before lint runs. Re-enable by 2026-04-01 once
          # the schema fetch is reliable again; track in this PR/branch discussion.
          verify: false

  # Builds the dashboard embedded in the release binary. Only the Build job
  # waits for it: the test jobs embed a generated stub (`make frontend-stub`)
  # because the three tests that read the bundle only need an index.html that
  # references hashed assets. This job has no secrets and no git credentials:
  # the bundle that ends up in releases is produced here from the committed
  # sources and package-lock.json only. See docs/adr/0010-dashboard-built-in-ci.md.
  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'

      # --ignore-scripts: the build needs no npm lifecycle scripts, so none
      # get to run.
      - name: Install frontend dependencies
        run: cd web/dashboard && npm ci --no-audit --no-fund --ignore-scripts

      - name: Run dashboard JavaScript tests
        run: make test-dashboard

      - name: Check dashboard sources
        run: cd web/dashboard && npx svelte-check --tsconfig ./jsconfig.json

      - name: Build dashboard
        run: cd web/dashboard && npm run build

      - name: Upload dashboard build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dist
          path: internal/admin/dashboard/static/dist
          if-no-files-found: error
          retention-days: 1

  # One job for the whole unit suite plus the contract replay suite (an
  # in-memory suite behind a build tag). PostgreSQL is a service container and
  # MongoDB a replica set from tools/ci/mongo-replset.sh; without them
  # GOMODEL_TEST_POSTGRES_URL and MONGO_TEST_DSN are unset, every PostgreSQL
  # and MongoDB subtest skips, and CI stays green while covering only SQLite.
  # Pull requests run without the race detector; pushes to main run under
  # -race.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Mirrors Docker Hub's official image. Anonymous pulls of
        # registry-1.docker.io intermittently time out on GitHub runners.
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: gomodel
          POSTGRES_PASSWORD: gomodel
          POSTGRES_DB: gomodel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gomodel -d gomodel"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Start MongoDB
        run: sh tools/ci/mongo-replset.sh start

      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          key: unit

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Stub the dashboard bundle
        run: make frontend-stub

      - name: Wait for MongoDB
        run: sh tools/ci/mongo-replset.sh wait

      - name: Run tests
        run: >-
          go test ${{ env.GO_TEST_SHORT }} ${{ github.event_name == 'push' && '-race' || '' }}
          -tags=contract -coverprofile=coverage.out -timeout=15m
          ./cmd/... ./config/... ./ext/... ./internal/... ./run/... ./tests/contract/...
        env:
          # Deliberately not POSTGRES_URL / MONGODB_URL: the suites create and
          # drop schemas and databases, so pointing them at a configured
          # application database is opt-in.
          GOMODEL_TEST_POSTGRES_URL: postgres://gomodel:gomodel@localhost:5432/gomodel
          MONGO_TEST_DSN: mongodb://localhost:27017/?replicaSet=rs&directConnection=true

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          key: e2e

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Stub the dashboard bundle
        run: make frontend-stub

      - name: Run tests
        run: go test ${{ env.GO_TEST_SHORT }} -tags=e2e -timeout=5m ./tests/e2e/...

  # MongoDB still comes from TestMain, which starts it as a replica set — a
  # service container cannot be one. PostgreSQL is a service container, so the
  # runner pulls and starts it while the suite compiles rather than after;
  # GOMODEL_INTEGRATION_POSTGRES_URL tells TestMain to use it.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # The version TestMain starts locally, from the ECR Public mirror of
        # Docker Hub's official image.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gomodel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d gomodel_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          key: integration

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Stub the dashboard bundle
        run: make frontend-stub

      - name: Run tests
        run: go test -tags=integration -timeout=10m ./tests/integration/...
        env:
          # The suite drops and recreates its tables, so the database name has
          # to end in _test — TestMain refuses anything else.
          GOMODEL_INTEGRATION_POSTGRES_URL: postgres://test:test@localhost:5432/gomodel_test?sslmode=disable

  performance:
    name: Performance Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          key: perf

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run performance guards
        # Allocation and voice-routing latency thresholds are maintained in tests/perf/.
        run: make perf-check

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Scans the dependency graph against the Go vulnerability database,
      # reporting only vulnerabilities reachable from our code. The second run
      # covers the swagger-tagged production build (swagger_enabled.go), which
      # the default tag set excludes. The tests/* suites behind e2e/integration/
      # contract tags are deliberately skipped — they aren't in the shipped binary.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
          govulncheck -tags=swagger ./...

  # Only runs when the pull request touches docs/. Pushes to main always run
  # it. The check needs a full Node toolchain (libsecret, mint) that costs
  # more than the validation itself.
  docs-validate:
    name: Docs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The pull request merge commit's first parent is the base branch,
          # so a depth of 2 is enough to diff against it.
          fetch-depth: 2

      - name: Check for docs changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD -- docs/ | grep -q .; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No docs/ changes; skipping validation."
          fi

      # To avoid possible issues related to missing libsecret binary on the runner runner
      - name: Install system dependencies
        if: steps.changes.outputs.docs == 'true'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Setup Node.js
        if: steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate docs.json
        if: steps.changes.outputs.docs == 'true'
        run: npx mint validate
        working-directory: docs

  # Compiling the binary doesn't depend on tests passing, so this runs in
  # parallel with the test jobs rather than gating behind them. It is the one
  # Go job that embeds the real dashboard bundle.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download dashboard build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: internal/admin/dashboard/static/dist

      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          key: build

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify module integrity
        run: make mod-check

      - name: Build
        run: go build -v ./cmd/gomodel
