name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"

# Restrict token permissions to minimum required
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: test-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download dashboard assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-dist
          path: internal/admin/dashboard/static/dist
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.13+ supports Go 1.27 and bundles a compatible staticcheck.
          version: v2.13.1
          # The shared analysis cache went bad on 2026-08-25: staticcheck lost
          # t.Fatal no-return facts and every run flagged a different set of
          # SA5011 false positives in untouched files, on PR branches and main
          # alike. A cold analysis is deterministic, so skip the cache; it costs
          # a few minutes per run. Revisit if golangci-lint-action gets a way to
          # rotate a corrupted cache key.
          skip-cache: true
          # Temporary workaround: config verification fetches the remote JSON schema and
          # intermittently times out in CI before lint runs. Re-enable by 2026-04-01 once
          # the schema fetch is reliable again; track in this PR/branch discussion.
          verify: false

  # The unit suite is the only one that needs a database service: one store
  # implementation now serves SQLite and PostgreSQL, and without this service
  # GOMODEL_TEST_POSTGRES_URL is unset, every PostgreSQL subtest skips, and CI
  # stays green while covering only SQLite.
  #
  # It runs on its own rather than in the matrix below because a service
  # container is pulled before the job starts, so a registry hiccup fails the
  # job outright. Attaching it to suites that never open a database put three
  # extra jobs at that risk for no coverage.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: test-dashboard
    services:
      postgres:
        # Mirrors Docker Hub's official image. Anonymous pulls of
        # registry-1.docker.io intermittently time out on GitHub runners, which
        # fails the job before a single test runs.
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: gomodel
          POSTGRES_PASSWORD: gomodel
          POSTGRES_DB: gomodel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gomodel -d gomodel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download dashboard assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-dist
          path: internal/admin/dashboard/static/dist

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: make test-race
        env:
          FRONTEND_PREBUILT: "1"
          # Deliberately not POSTGRES_URL: the suite creates and drops schemas,
          # so pointing it at a configured application database is opt-in.
          GOMODEL_TEST_POSTGRES_URL: postgres://gomodel:gomodel@localhost:5432/gomodel

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  # The E2E, integration, and contract suites share identical setup and differ
  # only in the test command, so they run as one matrix. None of them reads
  # GOMODEL_TEST_POSTGRES_URL — the integration suite brings up its own
  # containers in TestMain — so none takes a service container.
  go-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test-dashboard
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: E2E Tests
            cmd: go test -v -tags=e2e -timeout=5m ./tests/e2e/...
          - name: Integration Tests
            cmd: go test -v -tags=integration -timeout=10m ./tests/integration/...
          - name: Contract Replay Tests
            cmd: go test -v -tags=contract -timeout=5m ./tests/contract/...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download dashboard assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-dist
          path: internal/admin/dashboard/static/dist

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: ${{ matrix.cmd }}

  test-dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Run dashboard JavaScript tests
        run: make test-dashboard

      - name: Check dashboard sources
        run: make check-dashboard

      - name: Build dashboard assets
        run: make frontend

      - name: Upload dashboard assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-dist
          path: internal/admin/dashboard/static/dist
          if-no-files-found: error
          retention-days: 1

  performance:
    name: Performance Guard
    runs-on: ubuntu-latest
    needs: test-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download dashboard assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-dist
          path: internal/admin/dashboard/static/dist

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run performance guards
        # Allocation and voice-routing latency thresholds are maintained in tests/perf/.
        run: make perf-check
        env:
          FRONTEND_PREBUILT: "1"

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test-dashboard
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download dashboard assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-dist
          path: internal/admin/dashboard/static/dist

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Scans the dependency graph against the Go vulnerability database,
      # reporting only vulnerabilities reachable from our code. The second run
      # covers the swagger-tagged production build (swagger_enabled.go), which
      # the default tag set excludes. The tests/* suites behind e2e/integration/
      # contract tags are deliberately skipped — they aren't in the shipped binary.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
          govulncheck -tags=swagger ./...

  docs-validate:
    name: Docs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # To avoid possible issues related to missing libsecret binary on the runner runner
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate docs.json
        run: npx mint validate
        working-directory: docs

  # Compile against the exact dashboard artifact shared by the test jobs.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download dashboard assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-dist
          path: internal/admin/dashboard/static/dist

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module integrity
        run: make mod-check

      - name: Build
        run: go build -v ./cmd/gomodel
