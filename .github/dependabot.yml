version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    ignore:
      # echo-swagger must stay on v1.5.0: it is the only release built against
      # echo/v5; v1.5.1+ depend on echo/v4 and pull it into the module graph.
      - dependency-name: "github.com/swaggo/echo-swagger"
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    # .oss-scanner holds the image for Anthropic's OSS Scanner; it pins the same Go.
    directories:
      - "/"
      - "/.oss-scanner"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    ignore:
      # Node stays on the major version CI uses (node-version in .github/workflows).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"

  # Images of the local development stack in docker-compose.yaml.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    groups:
      docker-compose:
        patterns:
          - "*"

  # Build-time dependencies of the embedded dashboard.
  - package-ecosystem: "npm"
    directory: "/web/dashboard"
    schedule:
      interval: "weekly"
    # Longer than the other ecosystems: a compromised npm release is usually
    # reported and unpublished within days. Security updates skip the cooldown.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows only; local composite actions are listed
    # separately or their pinned actions never get updated.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
