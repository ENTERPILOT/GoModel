name: Go caches
description: >-
  Restores the Go module and build caches and saves them at the end of the
  job. setup-go's own cache keys on go.sum alone and only saves on a miss, so
  the build cache froze at the first run after each dependency change and
  every job recompiled the whole module. Keying on the commit and falling
  back to the newest cache with the same go.sum keeps only the changed
  packages to compile.
inputs:
  key:
    description: Cache namespace, one per job (and shard) so a restored cache holds the objects that job needs.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('go.sum') }}-
          go-${{ runner.os }}-${{ inputs.key }}-
